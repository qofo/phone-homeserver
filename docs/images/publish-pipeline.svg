<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Publishing the same commit to the phone and to GitHub Pages"><title>Publishing the same commit to the phone and to GitHub Pages</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="900" height="340" fill="#ffffff"/><text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">One source, two servers, same commit</text><text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">publish_blog.sh builds both copies with the same Hugo binary.</text><rect x="24" y="128" width="220" height="70" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3"/><text x="36" y="149" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">qofo.github.io/</text><text x="36" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Hugo source: content/, themes/</text><text x="36" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">content-phone/ is phone-only</text><line x1="244" y1="163" x2="300" y2="163" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="128" width="210" height="70" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/><text x="312" y="149" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">publish_blog.sh</text><text x="312" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">phone · pages · publish · status</text><text x="312" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">one script, four verbs</text><path d="M 510 150 L 566 110" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/><rect x="566" y="76" width="310" height="74" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.3"/><text x="578" y="97" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">blog_builds/&lt;timestamp&gt;/  →  blog_public</text><text x="578" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">symlink swapped with rename(2), so a visitor</text><text x="578" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">never sees a half-written build</text><path d="M 510 178 L 566 218" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#a)"/><rect x="566" y="190" width="310" height="74" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1.3"/><text x="578" y="211" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">gh-pages branch  →  GitHub Pages</text><text x="578" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">pushed from the phone; a Pages build is</text><text x="578" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">requested over the API when none starts</text><text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">Why the phone builds Pages too</text><text x="24" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">The git credential is a classic token with only the repo scope,</text><text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">so a push that contains .github/workflows/ is refused. Building</text><text x="24" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">on the phone takes about two seconds and needs no Actions minutes.</text></svg>
