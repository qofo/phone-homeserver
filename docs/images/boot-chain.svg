<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="How a service survives a reboot, a crash and a logout"><title>How a service survives a reboot, a crash and a logout</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">Why the launcher lives outside proot</text><text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">Three triggers, one launcher, one session that no terminal owns.</text><rect x="24" y="70" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="1.3"/><text x="36" y="91" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">Termux:Boot</text><text x="36" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">trigger: reboot</text><line x1="274" y1="96" x2="316" y2="242" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="190" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="1.3"/><text x="36" y="211" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">termux-job-scheduler</text><text x="36" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">trigger: every 15 min</text><line x1="274" y1="216" x2="316" y2="242" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="310" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="1.3"/><text x="36" y="331" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">start_services.sh start</text><text x="36" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">trigger: manual</text><line x1="274" y1="336" x2="316" y2="242" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="316" y="190" width="250" height="104" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/><text x="328" y="211" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">termux/ensure-daemon.sh</text><text x="328" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">already running? exit 0</text><text x="328" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">disabled flag set? exit 0</text><text x="328" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">otherwise: setsid nohup proot-distro …</text><line x1="566" y1="242" x2="610" y2="242" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="610" y="216" width="266" height="52" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3"/><text x="622" y="237" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">supervisor (start-daemon)</text><text x="622" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">own session, no controlling terminal</text><path d="M 743 268 L 743 300 L 743 316" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="610" y="316" width="266" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="622" y="337" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">serve_blog.py  +  ngrok</text><text x="622" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">restarted within 10 s if the process is gone</text><text x="622" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">killed and restarted if it answers wrong</text><text x="24" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">What each layer defends against</text><text x="30" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">reboot</text><text x="300" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">Termux:Boot re-runs the launcher</text><text x="30" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">Android's low-memory killer</text><text x="300" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">the 15-minute job re-runs it too</text><text x="30" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">Ctrl+C or a closed SSH session</text><text x="300" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">setsid put the supervisor in its own session</text><text x="30" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">a process that lives but stopped working</text><text x="300" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">the supervisor probes it, not just pgrep</text></svg>
