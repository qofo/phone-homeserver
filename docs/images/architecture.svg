<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="Layer stack of the phone server"><title>Layer stack of the phone server</title><desc>Android hosts Termux, Termux hosts a proot Ubuntu, and Ubuntu runs three independent supervisors.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="900" height="580" fill="#ffffff"/><text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">One phone, four layers, three independent supervisors</text><text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">Nothing here needs root, a router setting, or a cloud VM.</text><rect x="20" y="64" width="860" height="446" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="34" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1a7f37" text-anchor="start">Android 9  ·  Galaxy Note FE (SM-N935L, aarch64)  ·  not rooted</text><rect x="38" y="96" width="824" height="398" rx="8" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/><text x="52" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#24292f" text-anchor="start">Termux  ·  the only app involved</text><rect x="56" y="128" width="336" height="54" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.3"/><text x="68" y="149" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">Termux:Boot</text><text x="68" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">runs ~/.termux/boot/*.sh once, after every reboot</text><rect x="406" y="128" width="438" height="54" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.3"/><text x="418" y="149" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">termux-job-scheduler  (every 15 min)</text><text x="418" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">re-launches any supervisor that is missing — outside proot</text><rect x="56" y="202" width="788" height="274" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="70" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#bc4c00" text-anchor="start">proot-distro: Ubuntu 26.04 LTS  ·  glibc, no systemd, fake root</text><rect x="72" y="236" width="240" height="52" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3"/><text x="84" y="257" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">start_services.sh</text><text x="84" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">supervisor · 10 s loop · own session</text><line x1="192" y1="288" x2="192" y2="304" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="72" y="310" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="84" y="331" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">serve_blog.py  :8080</text><text x="84" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Hugo build + /api/metrics</text><line x1="192" y1="362" x2="192" y2="368" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="72" y="374" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="84" y="395" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">ngrok  tunnel</text><text x="84" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">fixed free domain, HTTPS</text><rect x="72" y="440" width="240" height="24" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/><text x="192" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0969da" text-anchor="middle">public</text><rect x="330" y="236" width="240" height="52" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3"/><text x="342" y="257" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">private_docs.sh</text><text x="342" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">supervisor · 10 s loop · own session</text><line x1="450" y1="288" x2="450" y2="304" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="310" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="342" y="331" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">private_docs_server.py  :8081</text><text x="342" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">markdown viewer, no directory listing</text><line x1="450" y1="362" x2="450" y2="368" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="374" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="342" y="395" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">private_docs.list</text><text x="342" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">an explicit allow-list of files</text><rect x="330" y="440" width="240" height="24" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/><text x="450" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#8250df" text-anchor="middle">tailnet only</text><rect x="588" y="236" width="240" height="52" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3"/><text x="600" y="257" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">code_server.sh</text><text x="600" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">supervisor · 10 s loop · own session</text><line x1="708" y1="288" x2="708" y2="304" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="588" y="310" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="600" y="331" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">code-server  :8443</text><text x="600" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">VS Code in the browser, over HTTPS</text><line x1="708" y1="362" x2="708" y2="368" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="588" y="374" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="600" y="395" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">local CA</text><text x="600" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">name-constrained, issued on the phone</text><rect x="588" y="440" width="240" height="24" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/><text x="708" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#8250df" text-anchor="middle">tailnet only</text><text x="24" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">The public internet reaches only the blue port. The purple ports are bound to the Tailscale address,</text><text x="24" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">so they do not exist for anyone else. Every supervisor is launched from Termux with setsid, because proot</text><text x="24" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">runs with --kill-on-exit and would otherwise take its children down with the login session.</text></svg>
