<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Active health check instead of a process check"><title>Active health check instead of a process check</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">A process that is alive but not working</text><text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">pgrep said RUNNING for 23 minutes while visitors got an error page.</text><rect x="24" y="100" width="200" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/><text x="36" y="121" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">every 10 s</text><text x="36" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">the supervisor wakes up</text><line x1="224" y1="128" x2="268" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="268" y="100" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="280" y="121" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">is the process there?</text><text x="280" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">pgrep on an anchored pattern</text><line x1="478" y1="128" x2="522" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><rect x="522" y="100" width="230" height="56" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/><text x="534" y="121" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">does it answer correctly?</text><text x="534" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">HTTP probe on the real port</text><path d="M 637 156 L 637 196" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#a)"/><text x="648" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#cf222e" text-anchor="start">no, three times in a row</text><rect x="522" y="196" width="230" height="56" rx="6" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.3"/><text x="534" y="217" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">kill it, then restart</text><text x="534" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">downtime written to a log</text><path d="M 522 224 L 400 224 L 400 160" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/><text x="24" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">Thresholds that matter</text><text x="30" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">3 consecutive failures</text><text x="252" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">one slow answer is not an outage</text><text x="30" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">90 s grace after a start</text><text x="252" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">code-server needs time to come up</text><text x="30" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">•</text><text x="44" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">probe the endpoint, not the port</text><text x="252" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">ngrok answers on the port while offline</text><text x="24" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Full incident write-up: docs/07-troubleshooting.md and part 7 of the blog series.</text></svg>
