<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Public path versus tailnet-only path"><title>Public path versus tailnet-only path</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">Two doors, and the one that does not exist</text><text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">With no firewall inside proot, the bind address is the firewall.</text><rect x="24" y="92" width="190" height="62" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.3"/><text x="36" y="113" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">anyone on the internet</text><text x="36" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">a link in a blog post</text><rect x="24" y="214" width="190" height="62" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1.3"/><text x="36" y="235" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">your laptop / other phone</text><text x="36" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">signed in to your tailnet</text><rect x="24" y="320" width="190" height="62" rx="6" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.3"/><text x="36" y="341" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">anyone on the same Wi-Fi</text><text x="36" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">a stranger on café Wi-Fi</text><line x1="214" y1="123" x2="270" y2="123" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="96" width="200" height="54" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/><text x="282" y="117" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">ngrok edge</text><text x="282" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">fixed free HTTPS domain</text><line x1="470" y1="123" x2="526" y2="123" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/><line x1="214" y1="245" x2="526" y2="245" stroke="#8250df" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#8250df" text-anchor="start">WireGuard tunnel · 100.x.y.z</text><path d="M 214 351 L 430 351" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="232" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#cf222e" text-anchor="start">port never bound on the LAN address</text><text x="440" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#cf222e" text-anchor="start">✕</text><rect x="526" y="76" width="350" height="290" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="540" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#bc4c00" text-anchor="start">the phone</text><rect x="546" y="108" width="310" height="52" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.3"/><text x="558" y="129" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">0.0.0.0:8080   serve_blog.py</text><text x="558" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">public on purpose</text><rect x="546" y="176" width="310" height="52" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1.3"/><text x="558" y="197" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">100.x.y.z:8081   private_docs_server.py</text><text x="558" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">bound to the Tailscale address only</text><rect x="546" y="244" width="310" height="52" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1.3"/><text x="558" y="265" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1f2328" text-anchor="start">100.x.y.z:8443   code-server</text><text x="558" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">bound to the Tailscale address only</text><text x="546" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">A service bound to 100.x.y.z has no socket on wlan0.</text><text x="546" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Scanning the Wi-Fi subnet finds nothing to connect to.</text><text x="24" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">The private services add four more checks on top of the bind address: the peer address, the Host header,</text><text x="24" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#656d76" text-anchor="start">an explicit file allow-list, and a strict content security policy in the browser.</text></svg>
